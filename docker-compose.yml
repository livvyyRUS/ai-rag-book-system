services:
  postgres:
    image: postgres:alpine3.22
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - ./minio_data/:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  rag_service:
    build: rag_service
    ports:
      - "8000:8000"
    environment:
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_HOST: ${MINIO_HOST}
      HF_HOME: /hf_cache
      HF_EMBEDDINGS_MODEL: ${HF_EMBEDDINGS_MODEL}
    volumes:
      - ./hf_cache:/hf_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/rag"]
      interval: 30s
      timeout: 20s
      retries: 3
    depends_on:
      - minio
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL}   # модель, например llama3.2
    volumes:
      - ./ollama_models:/root/.ollama   # кэш моделей на хосте
    entrypoint: /bin/sh
    command:
      - -c
      - |
        ollama serve &
        SERVER_PID=$!
        echo 'Waiting for Ollama server to be ready...'
        while ! ollama list >/dev/null 2>&1; do
          sleep 1
        done
        echo 'Ollama server is ready.'
        if [ -n "$OLLAMA_MODEL" ]; then
          echo "Pulling model $OLLAMA_MODEL"
          ollama pull "$OLLAMA_MODEL"
          echo 'Model pull completed.'
        else
          echo 'No OLLAMA_MODEL specified, skipping pull.'
        fi
        wait $SERVER_PID
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5